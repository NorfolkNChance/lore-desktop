name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every target upstream publishes a liblore build for. Intel macOS is
          # intentionally absent — no upstream liblore; the CLI backend covers it.
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # bindgen needs libclang; the Windows runner ships LLVM but clang-sys
      # doesn't always find it without the hint.
      - name: Point bindgen at libclang (Windows)
        if: runner.os == 'Windows'
        run: echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `tauri::generate_context!` embeds ../dist at compile time, so the
      # frontend build must precede any cargo step.
      - name: Frontend typecheck + build
        run: |
          npm ci
          npm run build

      - name: Backend tests (default features)
        run: cargo test --lib
        working-directory: src-tauri

      - name: Fetch liblore (${{ matrix.target }})
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-liblore.sh ${{ matrix.target }}

      - name: Backend tests (--features liblore)
        run: cargo test --lib --features liblore
        working-directory: src-tauri
